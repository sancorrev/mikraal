openapi: 3.1.0
info:
  title: mikraal · Kraal tasks API
  version: 0.1.0
  summary: Tasks module of the Activities and communication service.
  description: |
    Service API consumed by `bff/web`. Spec: `mikraal-memory/specs/kraal-tasks.md`.

    - Every path is scoped to a group (tenant). The caller's identity comes from the bearer token; the BFF passes it through.
    - Permissions are decided by OpenFGA (ARQ-04). Each task returns the actions the caller may perform in `allowedActions`.
    - The service only stores identifiers of people, positions, councils and events. Names are resolved by the BFF (ARQ-01, point 8: no cross joins).
    - Writes are explicit commands with an actor (ARQ-01, group 2). Writes on an existing task need `If-Match` with its `version`.
    - Identifiers are UUIDv7 and may be generated by the client, which makes creation idempotent (ARQ-01, point 9).
    - Errors use RFC 9457 problem details.
servers:
  - url: http://localhost:8081
    description: Local activities service
security:
  - bearerAuth: []
tags:
  - name: Tasks
    description: Kraal tasks, their status changes and history.
  - name: Tags
    description: The group's tag catalogue.
  - name: Capabilities
    description: What the caller may do in the module.

paths:
  /groups/{groupId}/tasks:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      description: Every scouter in the group can list every task. Deleted tasks are never returned.
      parameters:
        - name: status
          in: query
          description: One or more statuses. Omitted = all.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
          style: form
          explode: false
        - name: assignedTo
          in: query
          description: |
            `me` = tasks assigned to the caller directly or through their positions.
            `person:<id>`, `position:<id>`, or `unassigned`.
          schema:
            type: string
            examples: [me, unassigned, 'person:0192f3a0-0000-7000-8000-000000000001']
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: linked
          in: query
          description: Tasks linked to an item, as `council:<id>`, `event:<id>` or `position:<id>`.
          schema:
            type: string
        - name: dueFrom
          in: query
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          schema:
            type: string
            format: date
        - name: overdue
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: Requires the «Crear tareas» permission. Sending the same `id` again returns the existing task (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '200':
          description: Already created with this `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{groupId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      responses:
        '200':
          description: The task.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Edit or reassign a task
      description: Creator and group coordination only. Fields left out stay as they are; `null` clears an optional field.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '428': { $ref: '#/components/responses/IfMatchRequired' }
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: |
        Creator and group coordination only. Final: the task cannot be recovered.
        The service keeps a tombstone for sync and an audit record (ARQ-01, points 6 and 10).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '428': { $ref: '#/components/responses/IfMatchRequired' }

  /groups/{groupId}/tasks/{taskId}/status-changes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: changeTaskStatus
      summary: Change the status of a task
      description: |
        Owners and creator only. Allowed transitions:
        pending → in_progress | paused | finished;
        in_progress → pending | paused | finished;
        paused → pending | in_progress | finished;
        finished → in_progress (reopen).
        `pauseReason` is required when moving to `paused` and not allowed otherwise.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTaskStatus'
      responses:
        '200':
          description: Status changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/VersionMismatch' }
        '428': { $ref: '#/components/responses/IfMatchRequired' }

  /groups/{groupId}/tasks/{taskId}/recurrence/end:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: endTaskRecurrence
      summary: Stop future instances of a recurring task
      description: Creator and group coordination only. Existing instances stay.
      responses:
        '204':
          description: Recurrence ended.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The task has no active recurrence.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /groups/{groupId}/tasks/{taskId}/history:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTaskHistory
      summary: Change history of a task
      description: Newest first. History is never overwritten (ARQ-01, point 3).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of history entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHistoryPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/task-tags:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Tags]
      operationId: listTaskTags
      summary: List the group's tag catalogue
      responses:
        '200':
          description: All tags, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskTag'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tags]
      operationId: createTaskTag
      summary: Add a tag to the catalogue
      description: Group coordination only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskTag'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTag'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/DuplicateTag' }

  /groups/{groupId}/task-tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tags]
      operationId: renameTaskTag
      summary: Rename a tag
      description: Group coordination only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskTag'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTag'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DuplicateTag' }
    delete:
      tags: [Tags]
      operationId: deleteTaskTag
      summary: Remove a tag from the catalogue
      description: Group coordination only. The tag is removed from every task that carries it; history keeps the record.
      responses:
        '204':
          description: Removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/task-capabilities:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Capabilities]
      operationId: getTaskCapabilities
      summary: What the caller may do in the tasks module
      description: Lets the web show or hide «Crear tarea» and the tag catalogue.
      responses:
        '200':
          description: The caller's capabilities in this group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCapabilities'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Issued by the development login for now; replaced by the identity provider of workshop 5.

  headers:
    ETag:
      description: The task `version`, quoted (e.g. `"3"`). Send it back in `If-Match`.
      schema:
        type: string

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      description: The group (tenant).
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The task's current ETag.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller may not do this (not a scouter of the group, or missing permission).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such task or tag in this group.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: The request is not valid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    VersionMismatch:
      description: The task changed since the caller read it. Reload and retry.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IfMatchRequired:
      description: The `If-Match` header is missing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidTransition:
      description: The status change is not allowed from the current status.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DuplicateTag:
      description: A tag with that name already exists in the catalogue.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    TaskStatus:
      type: string
      enum: [pending, in_progress, paused, finished]
      description: 'UI labels: «Pendiente», «En curso», «Pausada», «Terminada».'

    RecurrencePeriod:
      type: string
      enum: [weekly, monthly, round]

    OwnerRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [person, position]
        id:
          type: string
          format: uuid

    LinkRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [council, event, position]
        id:
          type: string
          format: uuid

    Recurrence:
      type: object
      required: [seriesId, period, active]
      properties:
        seriesId:
          type: string
          format: uuid
          description: Shared by every instance of the series.
        period:
          $ref: '#/components/schemas/RecurrencePeriod'
        active:
          type: boolean
          description: False once the recurrence has been ended.

    TaskAction:
      type: string
      enum: [change_status, edit, delete, end_recurrence]

    Task:
      type: object
      required: [id, groupId, title, status, owners, tagIds, links, overdue, unassigned, createdBy, createdAt, updatedAt, version, allowedActions]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        pauseReason:
          type: [string, 'null']
          description: Present only while `status` is `paused`.
        owners:
          type: array
          items:
            $ref: '#/components/schemas/OwnerRef'
        dueDate:
          type: [string, 'null']
          format: date
          description: Deadline as a date in the group's time zone.
        reminderDaysBefore:
          type: [integer, 'null']
          minimum: 0
          maximum: 30
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkRef'
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        overdue:
          type: boolean
          description: True when open (not finished) and past its deadline. UI shows «Vencida».
        unassigned:
          type: boolean
          description: True when no owner remains. UI shows «Sin responsable».
        createdBy:
          type: string
          format: uuid
          description: Person id.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        allowedActions:
          type: array
          description: What the caller may do with this task, decided by OpenFGA.
          items:
            $ref: '#/components/schemas/TaskAction'

    CreateTask:
      type: object
      required: [title]
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-generated UUIDv7. Makes the request idempotent.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        owners:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/OwnerRef'
        dueDate:
          type: string
          format: date
        reminderDaysBefore:
          type: integer
          minimum: 0
          maximum: 30
          description: Only with `dueDate`. Defaults to 2 when `dueDate` is set.
        tagIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        links:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/LinkRef'
        recurrence:
          type: object
          required: [period]
          description: Requires `dueDate`.
          properties:
            period:
              $ref: '#/components/schemas/RecurrencePeriod'

    UpdateTask:
      type: object
      description: JSON merge patch. Status changes go through `status-changes`, not here.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 5000
        owners:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/OwnerRef'
        dueDate:
          type: [string, 'null']
          format: date
        reminderDaysBefore:
          type: [integer, 'null']
          minimum: 0
          maximum: 30
        tagIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        links:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/LinkRef'

    ChangeTaskStatus:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
        pauseReason:
          type: string
          minLength: 1
          maxLength: 500

    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type: [string, 'null']

    TaskHistoryEntry:
      type: object
      required: [id, at, actor, kind]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          type: object
          required: [personId]
          properties:
            personId:
              type: string
              format: uuid
            onBehalfOfPositionId:
              type: [string, 'null']
              format: uuid
              description: The position the actor acted as, when relevant (ARQ-01, point 6).
        kind:
          type: string
          enum: [created, edited, status_changed, owner_removed_on_leave, recurrence_ended, instance_created]
        changes:
          type: object
          description: Field → { from, to }. Only the fields that changed.
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}

    TaskHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskHistoryEntry'
        nextCursor:
          type: [string, 'null']

    TaskTag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateTaskTag:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40

    TaskCapabilities:
      type: object
      required: [canCreateTasks, canManageTags]
      properties:
        canCreateTasks:
          type: boolean
        canManageTags:
          type: boolean

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ['https://mikraal.app/problems/invalid-transition']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                    examples: [required, too_long, pause_reason_required, recurrence_requires_due_date]
